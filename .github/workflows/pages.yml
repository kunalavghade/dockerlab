name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; never cancel a deploy that is already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The site has no build step, so this checks the files are valid before publishing.
      - name: Check JavaScript syntax
        run: find assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      # Runs every command-reference lab against the simulated engine.
      - name: Test the simulated Docker engine
        run: npm test

      - name: Check lesson data loads
        run: node -e "import('./assets/js/lessons.js').then((m) => { if (!m.LESSONS.length) process.exit(1); console.log(m.LESSONS.length + ' lessons OK'); })"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
